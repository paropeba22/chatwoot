<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Login Grupo Telecom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.css">
</head>
<body class="text-slate-600 bg-black">
  <main class="flex flex-col w-full min-h-screen py-20 bg-[#0B0E14] bg-[radial-gradient(circle_at_center,rgba(0,82,255,0.1)_0%,transparent_50%)] sm:px-6 lg:px-8 font-sans">
    <section class="max-w-5xl mx-auto">
      <!-- Mock Logo -->
      <div class="mx-auto flex items-center justify-center h-16 w-48 bg-white/10 rounded backdrop-blur-sm text-white font-bold tracking-widest border border-white/20">
        LOGO_DARK.PNG
      </div>
      <h2 class="mt-6 text-3xl font-medium text-center text-white">
        Central de Comando
      </h2>
    </section>

    <section class="sm:mx-auto mt-11 sm:w-full sm:max-w-lg bg-[#0B0E14]/50 border border-[#24292F] backdrop-blur-sm p-11 sm:shadow-2xl sm:rounded-2xl">
      <div>
        <form class="space-y-5">
          <!-- Email Input -->
          <div>
            <label for="email_address" class="flex justify-between text-sm font-medium leading-6 text-white mb-1">
              Endereço de E-mail
            </label>
            <input
              id="email_address"
              name="email_address"
              type="text"
              placeholder="Digite seu e-mail"
              class="block w-full rounded-xl border-0 px-3 py-3 appearance-none shadow-sm ring-1 ring-inset text-white placeholder:text-slate-500 focus:ring-2 focus:ring-inset focus:ring-[#0052FF] sm:text-sm sm:leading-6 outline-none bg-black/20 ring-[#24292F]"
              style="color: #1a1a1a !important; background-color: #ffffff !important;"
            />
          </div>
          
          <!-- Password Input -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label for="password" class="text-sm font-medium leading-6 text-white">
                Senha
              </label>
              <p>
                <a href="#" class="text-sm text-[#0052FF] hover:text-[#003dbf]">
                  Esqueceu a senha?
                </a>
              </p>
            </div>
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Digite sua senha"
              class="block w-full rounded-xl border-0 px-3 py-3 appearance-none shadow-sm ring-1 ring-inset text-white placeholder:text-slate-500 focus:ring-2 focus:ring-inset focus:ring-[#0052FF] sm:text-sm sm:leading-6 outline-none bg-black/20 ring-[#24292F]"
              style="color: #1a1a1a !important; background-color: #ffffff !important;"
            />
          </div>

          <button
            type="button"
            class="mt-6 flex items-center w-full justify-center rounded-xl bg-[#0052FF] py-3 px-3 text-base font-medium text-white shadow-sm hover:bg-[#003dbf] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0052FF] cursor-pointer transition-colors duration-200"
          >
            <span>Acessar Central de Comando</span>
          </button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>

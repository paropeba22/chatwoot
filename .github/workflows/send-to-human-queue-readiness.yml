name: Send to human queue readiness

on:
  pull_request:
    paths:
      - 'app/**/automation_transition*'
      - 'app/services/conversations/automation_transitions/**'
      - 'app/javascript/dashboard/components/widgets/conversation/MoreActions.vue'
      - 'app/javascript/dashboard/components/widgets/conversation/specs/MoreActions.spec.js'
      - 'app/javascript/dashboard/api/inbox/conversation.js'
      - 'app/javascript/dashboard/api/specs/inbox/conversation.spec.js'
      - 'app/javascript/dashboard/store/modules/conversations/actions.js'
      - 'app/javascript/dashboard/store/modules/specs/conversations/{actions,getters}.spec.js'
      - 'app/javascript/dashboard/{constants/permissions.js,featureFlags.js}'
      - 'config/features.yml'
      - 'config/routes.rb'
      - 'db/migrate/*conversation_automation_transition*'
      - 'spec/**/conversation_automation_transition*'
      - 'docs/chatwoot_send_to_human_queue_phase1.md'
      - '.github/workflows/send-to-human-queue-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILS_ENV: test
  NODE_ENV: test

jobs:
  secrets:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: 8.24.3

  ruby_lint_changed:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop on Ruby files changed from develop
        shell: bash
        run: |
          git fetch --no-tags origin develop
          base_sha="$(git merge-base HEAD origin/develop)"
          mapfile -d '' ruby_files < <(git diff --name-only --diff-filter=ACMR -z "$base_sha"...HEAD -- '*.rb' ':!db/schema.rb')
          if ((${#ruby_files[@]} == 0)); then
            echo 'No changed Ruby files.'
            exit 0
          fi
          bundle exec rubocop --parallel -- "${ruby_files[@]}"

  migrations:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Load committed schema and migrate up
        run: bundle exec rails db:drop db:create db:schema:load db:migrate
      - name: Verify migration projection
        run: >-
          bundle exec rails runner
          'abort unless ActiveRecord::Base.connection.data_source_exists?("conversation_automation_transitions");
          abort unless ActiveRecord::Base.connection.index_exists?(:conversation_automation_transitions,
          %i[account_id conversation_id action idempotency_key], unique: true)'
      - name: Roll back phase 1 migration
        run: |
          bundle exec rails db:migrate:down VERSION=20260803000001
          bundle exec rails runner 'abort if ActiveRecord::Base.connection.data_source_exists?("conversation_automation_transitions")'
      - name: Reapply phase 1 migration
        run: |
          bundle exec rails db:migrate:up VERSION=20260803000001
          bundle exec rails runner 'abort unless ActiveRecord::Base.connection.data_source_exists?("conversation_automation_transitions")'
      - name: Upload schema generated by Rails
        uses: actions/upload-artifact@v4
        with:
          name: send-to-human-queue-generated-schema
          path: db/schema.rb
          if-no-files-found: error
      - name: Verify generated schema is committed
        run: git diff --exit-code -- db/schema.rb

  backend_specs:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare test database
        run: bundle exec rails db:create db:schema:load db:migrate
      - name: Phase 1 and related regression specs
        run: >-
          bundle exec rspec
          spec/models/conversation_automation_transition_spec.rb
          spec/policies/conversation_policy_spec.rb
          spec/enterprise/policies/enterprise/conversation_policy_spec.rb
          spec/requests/api/v1/accounts/conversation_automation_transitions_spec.rb
          spec/services/conversations/automation_transition_service_spec.rb
          spec/services/conversations/automation_transition_concurrency_spec.rb
          spec/models/conversation_spec.rb

  frontend_lint_changed:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint on frontend files changed from develop
        shell: bash
        run: |
          git fetch --no-tags origin develop
          base_sha="$(git merge-base HEAD origin/develop)"
          mapfile -d '' frontend_files < <(git diff --name-only --diff-filter=ACMR -z "$base_sha"...HEAD -- '*.js' '*.ts' '*.vue')
          if ((${#frontend_files[@]} == 0)); then
            echo 'No changed frontend files.'
            exit 0
          fi
          pnpm exec eslint -- "${frontend_files[@]}"

  frontend_tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phase 1 Vitest
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/api/specs/inbox/conversation.spec.js
          app/javascript/dashboard/components/widgets/conversation/specs/MoreActions.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/actions.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/getters.spec.js
          app/javascript/dashboard/store/modules/specs/conversations/mutations.spec.js
          --pool=forks --maxWorkers=1 --no-file-parallelism

name: Technical incidents readiness

on:
  pull_request:
    paths:
      - 'app/**/technical_incident*'
      - 'app/services/technical_incidents/**'
      - 'app/jobs/technical_incidents/**'
      - 'app/javascript/dashboard/**/technicalIncidents/**'
      - 'db/migrate/*technical_incident*'
      - 'spec/**/technical_incident*'
      - 'spec/services/technical_incidents/**'
      - 'spec/jobs/technical_incidents/**'
      - 'spec/initializers/rack/attack_technical_incidents_spec.rb'
      - 'spec/fixtures/technical_incidents/**'
      - 'script/technical_incidents/**'
      - 'docs/technical_incidents*'
      - '.github/workflows/technical-incidents-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILS_ENV: test
  NODE_ENV: test
  TECHNICAL_INCIDENTS_AUTOMATION_MODE: disabled
  TECHNICAL_INCIDENTS_OUTBOX_ENABLED: 'false'
  TECHNICAL_INCIDENTS_DELIVERY_ENABLED: 'false'
  TECHNICAL_INCIDENTS_API_INBOX_DELIVERY_ENABLED: 'false'

jobs:
  secrets:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: 8.24.3
      - name: Gitleaks full history
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.24.3
          detect --source=/repo --redact --verbose --log-opts=--all

  ruby_lint_changed:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop on Ruby files changed from develop
        shell: bash
        run: |
          git fetch --no-tags origin develop
          base_sha="$(git merge-base HEAD origin/develop)"
          mapfile -d '' ruby_files < <(git diff --name-only --diff-filter=ACMR -z "$base_sha"...HEAD -- '*.rb')
          if ((${#ruby_files[@]} == 0)); then
            echo 'No changed Ruby files.'
            exit 0
          fi
          printf 'Linting %s changed Ruby files.\n' "${#ruby_files[@]}"
          bundle exec rubocop --parallel -- "${ruby_files[@]}"
      - name: Global RuboCop diagnostic (non-blocking pre-existing debt)
        continue-on-error: true
        run: bundle exec rubocop --parallel

  migrations:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Create database and migrate up
        run: bundle exec rails db:drop db:create db:migrate
      - name: Roll back incident migrations by exact version
        run: |
          bundle exec rails db:migrate:down VERSION=20260720000001
          bundle exec rails db:migrate:down VERSION=20260717000003
          bundle exec rails db:migrate:down VERSION=20260717000002
          bundle exec rails db:migrate:down VERSION=20260717000001
          bundle exec rails runner 'abort if ActiveRecord::Base.connection.data_source_exists?("technical_incidents")'
          bundle exec rails runner 'abort if ActiveRecord::Base.connection.column_exists?(:accounts, :technical_incidents_enabled)'
      - name: Reapply incident migrations by exact version
        run: |
          bundle exec rails db:migrate:up VERSION=20260717000001
          bundle exec rails db:migrate:up VERSION=20260717000002
          bundle exec rails db:migrate:up VERSION=20260717000003
          bundle exec rails db:migrate:up VERSION=20260720000001
          bundle exec rails runner 'abort unless ActiveRecord::Base.connection.data_source_exists?("technical_incident_deliveries")'
          bundle exec rails runner 'abort unless TechnicalIncidentDelivery.column_names.include?("outbox_state")'
      - name: Upload schema generated by migrations
        uses: actions/upload-artifact@v4
        with:
          name: technical-incidents-generated-schema
          path: db/schema.rb
          if-no-files-found: error
      - name: Verify generated schema is committed
        run: git diff --exit-code -- db/schema.rb

  backend_specs:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare test database
        run: bundle exec rails db:create db:migrate
      - name: Technical incidents and related regression specs
        run: >-
          bundle exec rspec
          spec/models/technical_incident_spec.rb
          spec/models/technical_incident_account_isolation_spec.rb
          spec/models/concerns/technical_incidents_featurable_spec.rb
          spec/initializers/rack/attack_technical_incidents_spec.rb
          spec/policies/technical_incident_policy_spec.rb
          spec/requests/api/v1/technical_incident_checks_spec.rb
          spec/requests/api/v1/accounts/technical_incidents_spec.rb
          spec/services/technical_incidents
          spec/jobs/technical_incidents
          spec/listeners/webhook_listener_spec.rb
          spec/lib/webhooks/trigger_spec.rb
          spec/jobs/webhook_job_spec.rb
          spec/jobs/send_reply_job_spec.rb
          spec/models/message_spec.rb
          spec/models/conversation_spec.rb
          spec/models/agent_bot_spec.rb
          spec/controllers/api/v1/accounts/conversations/messages_controller_spec.rb
          spec/enterprise/models/custom_role_spec.rb

  frontend_lint_changed:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint on frontend files changed from develop
        shell: bash
        run: |
          git fetch --no-tags origin develop
          base_sha="$(git merge-base HEAD origin/develop)"
          mapfile -d '' frontend_files < <(git diff --name-only --diff-filter=ACMR -z "$base_sha"...HEAD -- '*.js' '*.ts' '*.vue')
          if ((${#frontend_files[@]} == 0)); then
            echo 'No changed frontend files.'
            exit 0
          fi
          printf 'Linting %s changed frontend files.\n' "${#frontend_files[@]}"
          pnpm exec eslint -- "${frontend_files[@]}"
      - name: Global ESLint diagnostic (non-blocking pre-existing debt)
        continue-on-error: true
        run: pnpm run eslint

  frontend_tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Technical incidents Vitest
        run: >-
          pnpm exec vitest run
          app/javascript/dashboard/routes/dashboard/technicalIncidents/specs
          app/javascript/dashboard/store/modules/specs/technicalIncidents.spec.js
          --pool=forks --maxWorkers=1 --no-file-parallelism

  contract_tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare contract test database
        run: bundle exec rails db:create db:migrate
      - name: AntiGravity export extractor tests
        run: node --test script/technical_incidents/extract_antigravity_contract.test.mjs
      - name: Chatwoot V1 contract specs
        run: bundle exec rspec spec/contracts/technical_incidents_v1_contract_spec.rb
